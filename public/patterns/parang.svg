<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 80" fill="none">
  <defs>
    <pattern id="parang-side" width="20" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <!-- Parang diagonal lines -->
      <line x1="0" y1="0" x2="20" y2="20" stroke="#C9A24B" stroke-width="1.5" stroke-opacity="0.6" />
      <line x1="0" y1="20" x2="20" y2="40" stroke="#C9A24B" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />
      <line x1="10" y1="-10" x2="20" y2="0" stroke="#C9A24B" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />
      
      <!-- Parang blade curves -->
      <path d="M 5 5 C 7 2, 10 4, 8 10 C 6 14, 10 12, 12 16" stroke="#5B3A1E" stroke-width="1.5" fill="none" stroke-opacity="0.5" />
      <path d="M 15 25 C 17 22, 20 24, 18 30 C 16 34, 20 32, 22 36" stroke="#5B3A1E" stroke-width="1.5" fill="none" stroke-opacity="0.5" />
      
      <!-- Small diamond accents (mlinjon) -->
      <polygon points="5,15 7,17 5,19 3,17" fill="#C9A24B" fill-opacity="0.5" />
      <polygon points="15,5 17,7 15,9 13,7" fill="#C9A24B" fill-opacity="0.5" />
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#parang-side)" />
</svg>