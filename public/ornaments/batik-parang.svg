<!-- TODO: ganti aset final jika tersedia dari desainer -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none">
  <defs>
    <pattern id="parang-pattern" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <!-- Diagonal main track -->
      <line x1="0" y1="0" x2="80" y2="80" stroke="#C9A24B" stroke-width="2" />
      <line x1="0" y1="40" x2="40" y2="80" stroke="#C9A24B" stroke-width="1.2" stroke-dasharray="3 3" />
      <line x1="40" y1="0" x2="80" y2="40" stroke="#C9A24B" stroke-width="1.2" stroke-dasharray="3 3" />

      <!-- Parang Blade Curve (Lidah Api) -->
      <path d="M 20 20 C 25 10, 35 15, 30 25 C 25 35, 35 35, 40 40" stroke="#5B3A1E" stroke-width="2" fill="none" />
      <path d="M 60 60 C 65 50, 75 55, 70 65 C 65 75, 75 75, 80 80" stroke="#5B3A1E" stroke-width="2" fill="none" />

      <!-- Mlinjon (Belah ketupat kecil di antara parang) -->
      <polygon points="20,40 25,45 20,50 15,45" fill="#C9A24B" />
      <polygon points="60,0 65,5 60,10 55,5" fill="#C9A24B" />
      <polygon points="60,80 65,85 60,90 55,85" fill="#C9A24B" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#parang-pattern)" />
</svg>
