<!-- TODO: ganti aset final jika tersedia dari desainer -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 36" fill="none">
  <defs>
    <linearGradient id="dividerGoldLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0" />
      <stop offset="80%" stop-color="#E5C77A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="dividerGoldRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="1" />
      <stop offset="20%" stop-color="#E5C77A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="centerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EBD7" />
      <stop offset="50%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#7D542E" />
    </linearGradient>
  </defs>

  <!-- Left Tapered Line -->
  <line x1="10" y1="18" x2="148" y2="18" stroke="url(#dividerGoldLeft)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="40" y1="21" x2="140" y2="21" stroke="url(#dividerGoldLeft)" stroke-width="0.6" stroke-dasharray="2 3" />

  <!-- Right Tapered Line -->
  <line x1="212" y1="18" x2="350" y2="18" stroke="url(#dividerGoldRight)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="220" y1="21" x2="320" y2="21" stroke="url(#dividerGoldRight)" stroke-width="0.6" stroke-dasharray="2 3" />

  <!-- Center Diamond & Flower Medallion -->
  <g transform="translate(180, 18)">
    <!-- Central Rhombus -->
    <path d="M 0 -14 L 14 0 L 0 14 L -14 0 Z" fill="url(#centerGold)" />
    <path d="M 0 -9 L 9 0 L 0 9 L -9 0 Z" fill="#5A1E24" />
    <circle cx="0" cy="0" r="3" fill="url(#centerGold)" />

    <!-- Side Petal Accents -->
    <circle cx="-20" cy="0" r="2" fill="url(#centerGold)" />
    <circle cx="20" cy="0" r="2" fill="url(#centerGold)" />
    <circle cx="-26" cy="0" r="1.2" fill="url(#centerGold)" />
    <circle cx="26" cy="0" r="1.2" fill="url(#centerGold)" />

    <path d="M -14 0 Q -20 -8 -16 -12" stroke="url(#centerGold)" stroke-width="0.8" fill="none" />
    <path d="M 14 0 Q 20 -8 16 -12" stroke="url(#centerGold)" stroke-width="0.8" fill="none" />
    <path d="M -14 0 Q -20 8 -16 12" stroke="url(#centerGold)" stroke-width="0.8" fill="none" />
    <path d="M 14 0 Q 20 8 16 12" stroke="url(#centerGold)" stroke-width="0.8" fill="none" />
  </g>
</svg>
